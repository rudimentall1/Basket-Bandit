<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Basket Bandit</title>
<meta name="description" content="Basket Bandit - catch the falling eggs across 4 lanes before you run out of lives!">
<meta name="theme-color" content="#1b2530">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="game-shell">
    <div id="canvas-wrap">
      <div id="stage">
        <canvas id="game-canvas"></canvas>
        <div id="ui-root"></div>
      </div>
    </div>
  </div>

  <div id="loading-screen">
    <div id="loading-inner">
      <div id="loading-title">Basket Bandit</div>
      <div id="loading-bar"><div id="loading-bar-fill"></div></div>
      <div id="loading-label">Loading assets...</div>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
